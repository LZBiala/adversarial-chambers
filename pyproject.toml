[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chambers"
version = "1.0.0"
description = "Adversarial multi-agent orchestration patterns: generator/refuter/judge role separation, a kill ledger where every verdict carries its cause of death, and an instruction-flip harness that cross-examines the judge itself. Every published number regenerates in CI with zero API keys."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "LZ Biala" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
